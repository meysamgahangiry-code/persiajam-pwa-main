<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B315B">
  <meta name="description" content="صندوق قرض‌الحسنه کارکنان پرشیا جام">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>صندوق قرض‌الحسنه کارکنان پرشیا جام</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fff;color:#173653;font-family:Tahoma,Arial,sans-serif}
    main{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
    img{width:112px;height:112px;object-fit:contain}
    p{font-size:14px;margin-top:16px}
    a{color:#0b6b45}
  </style>
</head>
<body>
  <main>
    <div>
      <img src="./icons/icon-192.png" alt="لوگوی صندوق قرض‌الحسنه کارکنان پرشیا جام">
      <p>در حال ورود به سامانه اصلی…</p>
      <noscript><p><a href="https://script.google.com/macros/s/AKfycbwpubZnu6HvBSWllBInGJrLHFr2bkf7-mr7xGdp0kbgxjxgLYeH0oIfF5JPtcsUzwRv0w/exec">ورود به سامانه اصلی</a></p></noscript>
    </div>
  </main>
  <script>
    const MAIN_URL = "https://script.google.com/macros/s/AKfycbwpubZnu6HvBSWllBInGJrLHFr2bkf7-mr7xGdp0kbgxjxgLYeH0oIfF5JPtcsUzwRv0w/exec";
    let redirected = false;
    function goToMain() {
      if (redirected) return;
      redirected = true;
      window.location.replace(MAIN_URL);
    }
    if ('serviceWorker' in navigator) {
      const registration = navigator.serviceWorker.register('./sw.js').catch(() => null);
      Promise.race([
        registration.then(() => navigator.serviceWorker.ready).catch(() => null),
        new Promise(resolve => setTimeout(resolve, 1800))
      ]).finally(goToMain);
    } else {
      setTimeout(goToMain, 500);
    }
    setTimeout(goToMain, 3500);
  </script>
</body>
</html>
