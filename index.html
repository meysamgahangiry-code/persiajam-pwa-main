<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B315B">
  <meta name="description" content="سامانه صندوق قرض‌الحسنه کارکنان پرشیا جام">

  <title>صندوق قرض‌الحسنه کارکنان پرشیا جام</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: linear-gradient(145deg, #0B315B, #123b32);
      color: white;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 22px;
      background: rgba(255,255,255,.09);
      box-shadow: 0 12px 35px rgba(0,0,0,.2);
    }

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 21px;
      line-height: 1.8;
      margin: 0 0 8px;
    }

    .subtitle {
      font-size: 13px;
      line-height: 2;
      color: #e2e9e6;
      margin-bottom: 26px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 13px;
      border: 0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .install {
      background: #d9b65d;
      color: #172c25;
    }

    .login {
      background: white;
      color: #123b32;
    }

    .hint {
      min-height: 42px;
      margin-top: 20px;
      font-size: 12px;
      line-height: 2;
      color: #e2e9e6;
    }
  </style>
</head>

<body>
  <main class="container">
    <img
      class="logo"
      src="./icons/icon-192.png"
      alt="لوگوی صندوق پرشیا جام"
    >

    <h1>صندوق قرض‌الحسنه کارکنان پرشیا جام</h1>

    <div class="subtitle">
      سامانه مدیریت وام و امور مالی کارکنان
    </div>

    <button id="installBtn" class="btn install" hidden>
      نصب اپلیکیشن صندوق
    </button>

    <a
      class="btn login"
      href="https://script.google.com/macros/s/AKfycbwpubZnu6HvBSwllBInGJrLHFr2bkf7-mr7xGdp0kbgxjxgLYeH0oIfF5JPtcsUzwRv0w/exec"
    >
      ورود به سامانه
    </a>

    <div id="hint" class="hint">
      برای نصب، از دکمه نصب یا منوی مرورگر استفاده کنید.
    </div>
  </main>

  <script>
    "use strict";

    const MAIN_URL =
      "https://script.google.com/macros/s/AKfycbwpubZnu6HvBSwllBInGJrLHFr2bkf7-mr7xGdp0kbgxjxgLYeH0oIfF5JPtcsUzwRv0w/exec";

    const installBtn = document.getElementById("installBtn");
    const hint = document.getElementById("hint");

    const isStandalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.matchMedia("(display-mode: fullscreen)").matches ||
      window.navigator.standalone === true;

    const launchSource =
      new URLSearchParams(window.location.search).get("source");

    // اجرای اپلیکیشن نصب‌شده: ورود مستقیم به سامانه
    if (isStandalone || launchSource === "pwa") {
      window.location.replace(MAIN_URL);
    } else {
      // ثبت Service Worker فقط در صفحه مرورگر
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .catch(() => {});
        });
      }
    }

    let deferredPrompt = null;

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.hidden = false;
      hint.textContent = "برای نصب، دکمه زیر را انتخاب کنید.";
    });
    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) {
        hint.textContent =
          "از منوی Chrome گزینه نصب اپلیکیشن را انتخاب کنید.";
        return;
      }

      const promptEvent = deferredPrompt;
      deferredPrompt = null;
      installBtn.hidden = true;

      try {
        await promptEvent.prompt();
        const result = await promptEvent.userChoice;

        hint.textContent =
          result.outcome === "accepted"
            ? "درخواست نصب تأیید شد."
            : "نصب لغو شد.";
      } catch (error) {
        hint.textContent = "برای نصب از منوی Chrome استفاده کنید.";
      }
    });

    window.addEventListener("appinstalled", () => {
      installBtn.hidden = true;
      hint.textContent = "اپلیکیشن صندوق نصب شد.";
    });
  </script>
</body>
</html>
