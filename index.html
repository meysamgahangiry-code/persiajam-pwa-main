<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B315B">

  <title>صندوق قرض‌الحسنه کارکنان پرشیا جام</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(145deg, #0B315B, #123b32);
      color: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 22px;
      background: rgba(255,255,255,0.09);
      box-shadow: 0 12px 35px rgba(0,0,0,0.2);
    }

    .logo {
      width: 116px;
      height: 116px;
      object-fit: contain;
      margin-bottom: 18px;
      border-radius: 50%;
      background: white;
    }

    h1 {
      font-size: 21px;
      line-height: 1.8;
      margin: 0 0 8px;
    }

    .subtitle {
      font-size: 13px;
      line-height: 2;
      color: #e2e9e6;
      margin-bottom: 26px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 13px;
      border: 0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .install {
      background: #d9b65d;
      color: #172c25;
    }

    .login {
      background: #ffffff;
      color: #123b32;
    }

    .hint {
      min-height: 42px;
      margin-top: 20px;
      font-size: 12px;
      line-height: 2;
      color: #e2e9e6;
    }
  </style>
</head>

<body>
  <main class="container">
    <img
      class="logo"
      src="./icons/icon-192.png"
      alt="لوگوی صندوق قرض‌الحسنه کارکنان پرشیا جام"
    >

    <h1>صندوق قرض‌الحسنه کارکنان پرشیا جام</h1>

    <div class="subtitle">
      سامانه مدیریت وام و امور مالی کارکنان
    </div>

    <button id="installBtn" class="btn install" hidden>
      نصب اپلیکیشن صندوق
    </button>

    <a
      class="btn login"
      href="https://script.google.com/macros/s/AKfycbwpubZnu6HvBSwllBInGJrLHFr2bkf7-mr7xGdp0kbgxjxgLYeH0oIfF5JPtcsUzwRv0w/exec"
    >
      ورود به سامانه
    </a>

    <div id="hint" class="hint">
      برای نصب اپلیکیشن، از گزینه نصب در مرورگر استفاده کنید.
    </div>
  </main>

<script>
  const MAIN_URL =
    "https://script.google.com/macros/s/AKfycbwpubZnu6HvBSwllBInGJrLHFr2bkf7-mr7xGdp0kbgxjxgLYeH0oIfF5JPtcsUzwRv0w/exec";

  const installBtn = document.getElementById("installBtn");
  const hint = document.getElementById("hint");

  // اگر اپلیکیشن از آیکون نصب‌شده اجرا شده باشد
  const standalone =
  window.matchMedia("(display-mode: standalone)").matches ||
  window.navigator.standalone === true;

const launchedFromPWA =
  new URLSearchParams(window.location.search).get("source") === "pwa";

if (standalone || launchedFromPWA) {
  window.location.replace(MAIN_URL);
}

  // ثبت Service Worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./sw.js")
        .catch(() => {});
    });
  }

  // دریافت درخواست نصب Chrome
  let deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredPrompt = event;
    installBtn.hidden = false;
    hint.textContent = "برای نصب، دکمه زیر را انتخاب کنید.";
  });

  // اجرای نصب با دکمه
  installBtn.addEventListener("click", async () => {
    if (!deferredPrompt) {
      hint.textContent =
        "برای نصب، از منوی Chrome گزینه Install and create shortcut را انتخاب کنید.";
      return;
    }

    try {
      deferredPrompt.prompt();

      const result = await deferredPrompt.userChoice;

      if (result.outcome === "accepted") {
        hint.textContent = "درخواست نصب تأیید شد.";
      } else {
        hint.textContent = "نصب لغو شد.";
      }

      deferredPrompt = null;
      installBtn.hidden = true;
    });

    window.addEventListener("appinstalled", () => {
      installBtn.hidden = true;
      hint.textContent = "اپلیکیشن صندوق نصب شد.";
    });
  </script>
</body>
</html>
